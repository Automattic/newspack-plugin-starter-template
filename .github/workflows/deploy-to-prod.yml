name: Deploy plugin to Multiple Prod sites

concurrency: custom-plugin-prod

permissions:
    contents: read
    actions: read

on:
    workflow_dispatch:
    push:
        branches:
            - release

jobs:
    Linting:
        uses: ./.github/workflows/linting.yml

    Deploy:
        name: Deploy (SFTP key auth)
        runs-on: ubuntu-latest
        needs: [Linting]
        timeout-minutes: 15
        env:
          PLUGIN_DEST: /htdocs/wp-content/plugins/custom-plugin
          # Staging dir is a SIBLING of the live plugin under plugins/, so the
          # cutover is a same-directory rename (fast, reliable, tiny window) —
          # no download/re-upload, and rollback is a rename back.
          PLUGIN_SOURCE: /htdocs/wp-content/plugins/custom-plugin__new
          PLUGIN_BACKUP: /htdocs/wp-content/plugins/custom-plugin__bak
          # SSH options shared by every lftp connection: authenticate with the
          # deploy key only, never fall back to an interactive prompt, and bound
          # the connect so a failed auth errors out quickly instead of hanging.
          # Host-key pinning is intentionally not used: sftp.wp.com is a gateway
          # pool whose nodes can present different host keys, so pinning one would
          # fail intermittently.
          SSH_OPTS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o ConnectTimeout=30"
        if: ${{ vars.PROD_SITES != '' }}
        strategy:
            matrix:
                # Site names are defined in repository variable PROD_SITES
                # Example: PROD_SITES = ["SITE_1","SITE_2","SITE_3"]
                site_name: ${{ fromJSON(vars.PROD_SITES) }}
            fail-fast: false

        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 2

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Build Project
              run: |
                  npm ci
                  npm run build --if-present

            - name: Setup PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
              with:
                  php-version: '7.4'
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --no-dev --optimize-autoloader

            # Write the SFTP private key (dedicated deploy key, not a personal
            # one) to a file outside the repo, readable only by the runner user.
            - name: Write SSH deploy key
              env:
                DEPLOY_KEY: ${{ secrets[format('PROD_SFTP_KEY_{0}', matrix.site_name)] }}
              run: |
                printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
                chmod 600 "$RUNNER_TEMP/deploy_key"

            # Stage exactly what should ship as the plugin. Exclusions live in
            # .deployignore at the repo root (rsync-native, single source of truth).
            - name: Stage plugin files for upload
              run: |
                rm -rf "$RUNNER_TEMP/plugin-stage"
                mkdir -p "$RUNNER_TEMP/plugin-stage"
                rsync -a --exclude-from=.deployignore ./ "$RUNNER_TEMP/plugin-stage/"

            # Upload the staged plugin into the sibling staging dir. --delete makes
            # the remote match the source, clearing any leftover from a prior run.
            - name: Upload plugin to staging directory
              env:
                SFTP_USER: ${{ secrets[format('PROD_SFTP_USER_{0}', matrix.site_name)] }}
              run: |
                sudo apt-get update -qq && sudo apt-get install -y -qq lftp
                lftp -c "
                  set sftp:connect-program 'ssh -i $RUNNER_TEMP/deploy_key -l $SFTP_USER $SSH_OPTS'
                  set cmd:interactive no
                  set net:timeout 30
                  set net:max-retries 2
                  open -u $SFTP_USER, sftp://sftp.wp.com
                  rm -rf $PLUGIN_SOURCE
                  mirror -R --delete $RUNNER_TEMP/plugin-stage/ $PLUGIN_SOURCE
                  bye
                "

            # Cut over with same-directory renames and roll back on failure, so a
            # failed/timed-out promote can never leave the live plugin missing.
            - name: Promote staged plugin (atomic rename + rollback)
              env:
                SFTP_USER: ${{ secrets[format('PROD_SFTP_USER_{0}', matrix.site_name)] }}
              run: |
                sudo apt-get update -qq && sudo apt-get install -y -qq lftp
                OPEN="set sftp:connect-program 'ssh -i $RUNNER_TEMP/deploy_key -l $SFTP_USER $SSH_OPTS'; set cmd:interactive no; set net:timeout 30; set net:max-retries 2; open -u $SFTP_USER, sftp://sftp.wp.com"
                lf() { lftp -c "$OPEN; $1; bye"; }

                # 0. Clear any stale backup from a previous failed run.
                lf "rm -rf $PLUGIN_BACKUP" || true

                # 1. Back up the live plugin IF it exists (first deploy has none).
                #    Existence is checked explicitly so we never mask a real error.
                BACKED_UP=0
                if lf "cd $PLUGIN_DEST"; then
                  lf "mv $PLUGIN_DEST $PLUGIN_BACKUP" || { echo "::error::could not back up existing plugin"; exit 1; }
                  BACKED_UP=1
                fi

                # 2. Promote the staged dir into place (same-directory rename).
                if ! lf "mv $PLUGIN_SOURCE $PLUGIN_DEST"; then
                  echo "::error::promote failed"
                  if [ "$BACKED_UP" = 1 ]; then
                    echo "restoring backup"
                    lf "rm -rf $PLUGIN_DEST" || true
                    lf "mv $PLUGIN_BACKUP $PLUGIN_DEST" \
                      || echo "::error::ROLLBACK FAILED — live plugin dir is missing, restore manually"
                  fi
                  exit 1
                fi

                # 3. Success — drop the backup.
                lf "rm -rf $PLUGIN_BACKUP" || true

            - name: Remove deploy key
              if: always()
              run: rm -f "$RUNNER_TEMP/deploy_key"
